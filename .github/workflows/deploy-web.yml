name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Verify local catalogue artifact
        working-directory: web
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("public/catalog/products.json","utf8")); const s=JSON.parse(fs.readFileSync("public/catalog/summary.json","utf8")); const images=fs.readdirSync("public/catalog/images").length; if(p.products.length!==s.products||images!==s.uniqueImageFiles||s.missingFiles!==0) throw new Error(`Catalogue validation failed: products=${p.products.length}, images=${images}, missing=${s.missingFiles}`); console.log(`Verified ${p.products.length} products and ${images} images`);'

      - name: Build
        working-directory: web
        # The anon/publishable key is meant to ship in the browser bundle —
        # it's only usable through the Row Level Security policies in
        # supabase/migration.sql — so it's fine as a plain workflow env var
        # rather than a repo secret.
        env:
          VITE_SUPABASE_URL: https://jtktjxmntfwbmonvzsle.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zZZbzJNtw2jPu2f8Ae7kXQ_959uXUoq
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # repo has never had Pages turned on in Settings before — let this
          # action create/enable the Pages site itself instead of only
          # looking one up (which 404s the first time)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
